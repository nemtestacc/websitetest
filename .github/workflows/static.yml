name: Update data.js

on:
  schedule:
    - cron: "*/5 * * * *"   # best-effort, not guaranteed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🔍 R2 auth sanity check
      - name: Quick R2 auth test
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python - << 'PY'
          import os, boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          acc = os.environ["R2_ACCOUNT_ID"]
          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{acc}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(connect_timeout=10, read_timeout=30),
          )

          bucket = os.environ["R2_BUCKET"]
          try:
              s3.list_objects_v2(Bucket=bucket, MaxKeys=1)
              print("✅ R2 auth OK. list_objects_v2 succeeded.")
          except ClientError as e:
              print("❌ R2 auth failed:", e)
              raise
          PY

      # 🚀 Main pipeline
      - name: Run data pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NEMWEB_MAX_PARSE_ZIPS: "800"
        run: |
          python src/main.py

      # 💾 Commit result
      - name: Commit updated data.js if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.js
          git diff --staged --quiet || (git commit -m "Update data.js" && git push)
